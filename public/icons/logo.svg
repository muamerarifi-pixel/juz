<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep architectural emerald base -->
    <linearGradient id="bg" x1="14%" y1="6%" x2="86%" y2="96%">
      <stop offset="0%" stop-color="#1e513c"/>
      <stop offset="48%" stop-color="#113325"/>
      <stop offset="100%" stop-color="#071811"/>
    </linearGradient>

    <!-- Soft top-left studio sheen -->
    <radialGradient id="sheen" cx="24%" cy="16%" r="64%">
      <stop offset="0%" stop-color="#60ae8a" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#1b4936" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm golden ambient backlight -->
    <radialGradient id="halo" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#e3ba66" stop-opacity="0.16"/>
      <stop offset="62%" stop-color="#b88832" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft seamless recessed center depth (no harsh camera-lens ring) -->
    <radialGradient id="well" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#04110b" stop-opacity="0.58"/>
      <stop offset="68%" stop-color="#061710" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#061710" stop-opacity="0"/>
    </radialGradient>

    <!-- Top glass bevel rim on tile -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Rich brushed champagne gold (front layer) -->
    <linearGradient id="goldFront" x1="16%" y1="8%" x2="84%" y2="92%">
      <stop offset="0%" stop-color="#f5da96"/>
      <stop offset="35%" stop-color="#ddb05b"/>
      <stop offset="72%" stop-color="#b68531"/>
      <stop offset="100%" stop-color="#875d1a"/>
    </linearGradient>

    <!-- Slightly deeper satin gold (back layer for genuine 3D layering) -->
    <linearGradient id="goldBack" x1="18%" y1="10%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#dfc077"/>
      <stop offset="45%" stop-color="#be9140"/>
      <stop offset="100%" stop-color="#7c5517"/>
    </linearGradient>

    <!-- Subtle top-edge chamfer highlight -->
    <linearGradient id="goldEdge" x1="12%" y1="6%" x2="86%" y2="92%">
      <stop offset="0%" stop-color="#fff5d6" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#f0ce82" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4d3209" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Luminous warm-ivory gradient for minimalist core ring -->
    <linearGradient id="ivory" x1="20%" y1="12%" x2="80%" y2="88%">
      <stop offset="0%" stop-color="#fffcf2"/>
      <stop offset="55%" stop-color="#efe3c6"/>
      <stop offset="100%" stop-color="#c9b78f"/>
    </linearGradient>

    <!-- Dimensional shadows -->
    <filter id="backShadow" x="-24%" y="-24%" width="148%" height="152%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#020a06" flood-opacity="0.56"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020a06" flood-opacity="0.38"/>
    </filter>
    <filter id="frontShadow" x="-24%" y="-24%" width="148%" height="152%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020a06" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#020a06" flood-opacity="0.45"/>
    </filter>
    <filter id="coreShadow" x="-28%" y="-28%" width="156%" height="156%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020a06" flood-opacity="0.48"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- Base tile -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#sheen)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#halo)"/>

    <!-- Seamless recessed depth under the star -->
    <circle cx="256" cy="256" r="118" fill="url(#well)"/>

    <!-- Back square (axis-aligned, deeper gold, sits beneath front diamond) -->
    <g filter="url(#backShadow)">
      <rect x="136" y="136" width="240" height="240" rx="22"
            fill="none" stroke="url(#goldBack)" stroke-width="23" stroke-linejoin="round"/>
      <rect x="136" y="136" width="240" height="240" rx="22"
            fill="none" stroke="url(#goldEdge)" stroke-width="2"/>
    </g>

    <!-- Front square (rotated 45 deg, brighter brushed gold casting real shadow onto back square) -->
    <g filter="url(#frontShadow)">
      <rect x="136" y="136" width="240" height="240" rx="22"
            transform="rotate(45 256 256)"
            fill="none" stroke="url(#goldFront)" stroke-width="23" stroke-linejoin="round"/>
      <rect x="136" y="136" width="240" height="240" rx="22"
            transform="rotate(45 256 256)"
            fill="none" stroke="url(#goldEdge)" stroke-width="2.2"/>
    </g>

    <!-- Minimalist Rub el Hizb core: delicate ivory ring + sculpted gold center point -->
    <g filter="url(#coreShadow)">
      <circle cx="256" cy="256" r="46" fill="none" stroke="url(#ivory)" stroke-width="14"/>
      <circle cx="256" cy="256" r="13.5" fill="url(#goldFront)"/>
      <circle cx="253" cy="252" r="4" fill="#fff7df" fill-opacity="0.65"/>
    </g>

    <!-- Tactile glass edge rim -->
    <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
</svg>
